<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 7 - Master Security Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h2 { color: #58a6ff; margin-top: 0; }
        p { font-size: 14px; line-height: 1.6; color: #8b949e; }
        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #238636;
            border: none;
            color: white;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #2ea043; }
        #output {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            font-weight: bold;
            word-break: break-all;
        }
        .success { background: rgba(46, 160, 67, 0.15); border: 1px solid #2ea043; color: #7ee787; }
        .error { background: rgba(248, 81, 73, 0.15); border: 1px solid #f85149; color: #f85149; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Stage 7: Root Verification Gateway</h2>
        <p>Enter the clearance key extracted from the Level 6 Bastion Terminal to unlock the Root Authority archive.</p>
        
        <input type="text" id="passkey" placeholder="Enter Level 6 Flag..." autocomplete="off">
        <button onclick="unlock()">Authenticate Key</button>

        <div id="output"></div>
    </div>

    <script>
        function unlock() {
            const input = document.getElementById("passkey").value.trim();
            const out = document.getElementById("output");
            
            // Expected Level 6 Flag
            if (input === "CTF{PyJ41L_35C4P3_M45T3R_2026}") {
                out.className = "success";
                out.style.display = "block";
                out.innerHTML = "Clearance Authorized!<br><br>CHAMPION FLAG:<br><code>CTF{CHAMPION_ROOT_GATEWAY_2026}</code>";
            } else {
                out.className = "error";
                out.style.display = "block";
                out.textContent = "Access Denied: Invalid clearance token.";
            }
        }
    </script>
</body>
</html>
